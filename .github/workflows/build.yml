name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: HeadTrackingHost-Windows
          - os: macos-latest
            artifact: HeadTrackingHost-macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build Windows EXE (portable, static runtime)
        if: runner.os == 'Windows'
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release --parallel
          mkdir out
          copy "build\HeadTrackingHost_artefacts\Release\Head Tracking Host.exe" "out\HeadTrackingHost.exe"
        shell: cmd

      - name: Build macOS app (Apple Silicon + Intel)
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel 4
          APP="build/HeadTrackingHost_artefacts/Release/Head Tracking Host.app"
          # Sign the whole bundle (ad-hoc) so macOS can remember the microphone permission.
          codesign --force --deep --sign - --identifier io.github.lumen-tools.head-tracking-host "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d --requirements - "$APP"
          plutil -p "$APP/Contents/Info.plist" | grep -i -E "NSMicrophoneUsageDescription|CFBundleIdentifier"
          mkdir -p out
          ditto -c -k --keepParent "$APP" "out/${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*

  release:
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          TAG="v$(cat VERSION)"
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            # Keep the same version until VERSION is changed: move the tag to the
            # current commit and replace the files in the existing release.
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/$TAG" \
              -f sha="${GITHUB_SHA}" -F force=true >/dev/null
            gh release upload "$TAG" artifacts/*/* --clobber --repo "${GITHUB_REPOSITORY}"
            # Remove files from older builds that this build no longer produces - but only if every
            # build succeeded, so a failed platform keeps its previous download.
            if [ "$BUILD_RESULT" != "success" ]; then
              echo "Not all builds succeeded - keeping existing release files."
              exit 0
            fi
            CURRENT=$(for f in artifacts/*/*; do basename "$f"; done)
            RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG" --jq .id)
            gh api "repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID/assets" --jq '.[] | "\(.id) \(.name)"' |
              while read -r ID NAME; do
                if ! grep -qxF "$NAME" <<< "$CURRENT"; then
                  echo "Removing stale asset $NAME"
                  gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/$ID"
                fi
              done
            exit 0
          fi
          gh release create "$TAG" artifacts/*/* --target "${GITHUB_SHA}" \
            --repo "${GITHUB_REPOSITORY}" --title "Version $(cat VERSION)" \
            --notes "Windows: download HeadTrackingHost.exe and run it. Mac: download HeadTrackingHost-macOS.zip, unzip it and open Head Tracking Host.app (see README)."
