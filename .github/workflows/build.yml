name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: HeadSmooth-Windows
          - os: macos-latest
            artifact: HeadSmooth-macOS-AppleSilicon
          - os: macos-15-intel
            artifact: HeadSmooth-macOS-Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python make_icons.py

      - name: Build Windows EXE
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name HeadSmooth --icon icon.ico app.py
          mkdir out
          copy dist\HeadSmooth.exe out\HeadSmooth.exe
        shell: cmd

      - name: Build macOS app
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --name HeadSmooth --icon icon.icns \
            --osx-bundle-identifier io.github.headsmooth app.py
          mkdir out
          ditto -c -k --keepParent dist/HeadSmooth.app "out/${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*

  release:
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(cat VERSION)"
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*/* --clobber --repo "${GITHUB_REPOSITORY}"
            exit 0
          fi
          gh release create "$TAG" artifacts/*/* --target "${GITHUB_SHA}" \
            --repo "${GITHUB_REPOSITORY}" --title "HeadSmooth $TAG" \
            --notes "Windows: download HeadSmooth.exe and run it. Mac: download the matching ZIP, unzip it and open HeadSmooth.app (see README)."
